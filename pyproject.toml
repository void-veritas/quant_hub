[project]
name = "quant-hub"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.109",
    "ccxt>=4.5.56",
    "duckdb>=1.5.3",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "lz4>=4.4.5",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=7.1.0",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
    "yfinance>=1.4.1",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle (E/W), pyflakes (F), isort (I), pyupgrade (UP), bugbear (B),
# and pydocstyle (D) for docstring coverage/formatting.
select = ["E", "W", "F", "I", "UP", "B", "D"]
# D105 (magic-method docstrings) and D107 (__init__ docstrings) are covered by the
# class docstring in this codebase; D401 is too rigid for math-first summaries.
ignore = ["D105", "D107", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Tests are self-documenting; require no module/function docstrings.
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]

[tool.black]
line-length = 100
